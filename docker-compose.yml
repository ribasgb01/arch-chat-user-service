version: '3.8'

services:
  db:
    image: postgres:16.4-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: 'postgres'
      POSTGRES_PASSWORD: 'postgres'
      POSTGRES_DB: 'chat_user_db'
    ports:
      - '5432:5432'

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"