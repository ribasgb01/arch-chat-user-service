spring.application.name=arch-chat-user-service

spring.datasource.url=jdbc:postgresql://localhost:5432/chat_user_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.cache.type=redis
spring.redis.host=localhost
spring.redis.port=6379

api.security.token.access-expiration=7200000
api.security.token.refresh-expiration=604800000

logging.level.org.springframework.security=DEBUG
api.security.token.secret=essa-chave-secreta-precisa-ser-longa-e-segura-com-mais-de-32-caracteres